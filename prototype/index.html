<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafEase CRM &amp; HRM</title>
<link rel="stylesheet" href="assets/css/fonts-poppins.css">
<link rel="stylesheet" href="assets/css/remixicon.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/hrm.css">
</head>
<body>
<!-- Scripts are loaded through a cache-busting stamp so a reload always gets the
     current file. Without it the browser serves a stale copy of one script, that
     script's routes never register, and the app quietly shows another page in
     place of the one asked for. document.write keeps them in order, as the tags
     it replaces were. -->
<script>
(function () {
  var JS = ['data','core','inbox','segments','campaigns','leads','settings','hrm-data','hrm','hrm-dashboard','hrm-pipeline','hrm-candidates','hrm-interviews','hrm-recruitments','hrm-config','hrm-guide','hrm-careers','patients','patients-record','patients-care','docs-forms','forms','analytics','staff','appts','billing','patient-portal','patient-appts','ehr-inbox','ehr-letters','settings-notif','settings-business','settings-more','settings-services','patient-request','soon','verticals','vertical-business','vertical-roles','hrm-rota','hrm-leave','vertical-settings','settings-bookings','dashboard','login'];
  /* Stamp only when served over http(s). Opened straight from disk there is
     no cache to defeat, and a query on a file:// URL can stop it loading. */
  var v = location.protocol === 'file:' ? '' : '?v=' + Date.now();
  window.__APP_JS__ = JS;
  window.__LOADED__ = {};
  for (var i = 0; i < JS.length; i++) document.write('<script src="assets/js/' + JS[i] + '.js' + v + '" onload="__LOADED__[\'' + JS[i] + '\']=1"><\/script>');
})();
</script>
<script>App.start();</script>
</body>
</html>
